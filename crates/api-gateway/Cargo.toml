[package]
name = "api-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
core-domain = { workspace = true }
storage = { workspace = true }
blockchain = { workspace = true }
chain-evm = { workspace = true }
chain-btc = { workspace = true }
chain-sol = { workspace = true }
signing-service = { workspace = true }
proto = { workspace = true }
kyc-aml = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
time = { version = "0.3" }
utoipa = { version = "5", features = ["uuid"] }
async-graphql = "7"
async-graphql-axum = "7"
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp"] }
async-trait = "0.1"
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
tower = "0.5"
tokio-tungstenite = "0.24"
futures-util = "0.3"
# Включаем тест-двойники зависимостей только для тестов — в production-сборку они не идут.
storage = { workspace = true, features = ["testing"] }
blockchain = { workspace = true, features = ["testing"] }
kyc-aml = { workspace = true, features = ["testing"] }
